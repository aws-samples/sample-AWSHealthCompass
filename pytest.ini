[pytest]
pythonpath = lambdas/shared/python
addopts = -m "not postdeploy"
markers =
    e2e: End-to-end Playwright tests (require JIRA test instance)
    dashboard_e2e: Dashboard Playwright E2E tests (require DASHBOARD_URL, API_URL, API_KEY)
    postdeploy: Post-deploy API smoke tests (require API_URL, API_KEY env vars)
    pipeline_e2e: End-to-end pipeline tests (require deployed stack + JIRA credentials)
