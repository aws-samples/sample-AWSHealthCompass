AWSTemplateFormatVersion: 2010-09-09
Description: 'CloudFormation template for AWS Health Event to ServiceNow Integration'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Deployment Configuration"
        Parameters:
          - DeployModel
          - AssumeRoleName
          - TagKey
      - Label:
          default: "ServiceNow Configuration"
        Parameters:
          - ServiceNowUrl
          - ServiceNowUsername
          - ServiceNowPassword
      - Label:
          default: "Lambda Code Location"
        Parameters:
          - S3BucketName
          - HealthEventProcessorLambdaKey
          - HealthEventSnowIntegrationLambdaKey
    ParameterLabels:
      DeployModel:
        default: "Deployment Model"
      AssumeRoleName:
        default: "Assume Role Name"
      TagKey:
        default: "Tag Key to Monitor"
      ServiceNowUrl:
        default: "ServiceNow Instance URL"
      ServiceNowUsername:
        default: "ServiceNow Username"
      ServiceNowPassword:
        default: "ServiceNow Password"
      S3BucketName:
        default: "S3 Bucket Name"
      HealthEventProcessorLambdaKey:
        default: "Health Event Processor Lambda S3 Key"
      HealthEventSnowIntegrationLambdaKey:
        default: "ServiceNow Integration Lambda S3 Key"

Parameters:
  DeployModel:
    Type: String
    AllowedValues: 
      - Account
      - Service
      - Tag
    Description: Select the deployment model for integration (Account, Service, Tag)
    
  AssumeRoleName:
    Type: String
    Description: |
      (Required only if DeploymentModel is Tag) 
      Name of the IAM role to assume in Tag deployment model for cross account resource tag listing
    MinLength: 0
    MaxLength: 64
    AllowedPattern: "^$|^[\\w+=,.@-]+$"
    ConstraintDescription: Role name must be empty or contain only alphanumeric and [+=,.@-] characters
    Default: ""

  TagKey:
    Type: String
    Description: |
      (Required only if DeploymentModel is Tag) 
      The tag key to monitor for routing Health events (e.g., 'Environment', 'Application', 'Team')
    MinLength: 0
    MaxLength: 128
    AllowedPattern: "^$|^[\\w+=,.@-]+$"
    ConstraintDescription: Tag key must be empty or contain only alphanumeric and [+=,.@-] characters
    Default: ""
    
  ServiceNowUrl:
    Type: String
    Description: ServiceNow instance URL (e.g., https://your-instance.service-now.com)
    
  ServiceNowUsername:
    Type: String
    Description: ServiceNow username
    NoEcho: true
    
  ServiceNowPassword:
    Type: String
    Description: ServiceNow password
    NoEcho: true
  
  S3BucketName:
    Type: String
    Description: S3 bucket containing Lambda code

  HealthEventProcessorLambdaKey:
    Type: String
    Description: S3 key for Health Event Processor Lambda code zip file

  HealthEventSnowIntegrationLambdaKey:
    Type: String
    Description: S3 key for ServiceNow Integration Lambda code zip file

Rules:
  ValidateAssumeRoleName:
    RuleCondition: !Equals 
      - !Ref DeployModel
      - 'Tag'
    Assertions:
      - Assert: !Not [!Equals [!Ref AssumeRoleName, ""]]
        AssertDescription: AssumeRoleName is required when DeploymentModel is Tag
      - Assert: !Not [!Equals [!Ref TagKey, ""]]
        AssertDescription: TagKey is required when DeploymentModel is Tag

Conditions:
  # IsAccountModel: !Equals [!Ref DeployModel, 'Account']
  # IsServiceModel: !Equals [!Ref DeployModel, 'Service']
  IsTagModel: !Equals [!Ref DeployModel, 'Tag']

Resources:
  # Event tracking table
  TrackEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: eventArn
          AttributeType: S
        - AttributeName: resourceArn
          AttributeType: S
      KeySchema:
        - AttributeName: resourceArn
          KeyType: HASH
        - AttributeName: eventArn
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: TETkeyIndex
          KeySchema:
            - AttributeName: eventArn
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expirationTime
        Enabled: true

  # ServiceNow credentials in Secrets Manager
  ServiceNowSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: ServiceNow credentials for AWS Health Event integration
      SecretString: !Sub |
        {
          "username": "${ServiceNowUsername}",
          "password": "${ServiceNowPassword}"
        }

  # SQS Queues
  HealthEventIngestionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-HealthEventIngestion-DLQ'
      MessageRetentionPeriod: 1209600  # 14 days

  HealthEventIngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-HealthEventIngestionQueue'
      VisibilityTimeout: 300  # 5 minutes, > Lambda timeout
      MessageRetentionPeriod: 345600  # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HealthEventIngestionDLQ.Arn
        maxReceiveCount: 3

  HealthEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-health-event-queue'
      VisibilityTimeout: 300  # > Lambda timeout
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt HealthEventDLQ.Arn
        maxReceiveCount: 3

  HealthEventDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-health-event-dlq'
      MessageRetentionPeriod: 1209600  # 14 days

  # SQS Queue Policy for EventBridge
  HealthEventIngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref HealthEventIngestionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt HealthEventIngestionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt HealthEventRule.Arn

  # Lambda Functions
  HealthEventProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-health-event-processor'
      Runtime: python3.9
      Handler: HealthEventProcessorLambda.lambda_handler 
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref HealthEventProcessorLambdaKey
      Environment:
        Variables:
          LOG_LEVEL: INFO
          SQS_QUEUE_URL: !Ref HealthEventQueue
          DYNAMODB_TRACK_TABLE: !Ref TrackEventTable
          JIRA_DYNAMODB_TABLE: !Ref TrackEventTable
          DEPLOY_MODEL: !Ref DeployModel
          ASSUME_ROLE_NAME: !If 
            - IsTagModel
            - !Ref AssumeRoleName
            - !Ref "AWS::NoValue"
          TAG_KEY: !If 
            - IsTagModel
            - !Ref TagKey
            - !Ref "AWS::NoValue"
      MemorySize: 256
      Timeout: 240
      Role: !GetAtt HealthEventProcessorRole.Arn

  # Event Source Mapping for Health Event Processor
  HealthEventProcessorEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt HealthEventIngestionQueue.Arn
      FunctionName: !Ref HealthEventProcessorFunction
      MaximumBatchingWindowInSeconds: 60  # 1 minute

  # ServiceNow Integration Lambda
  ServiceNowIntegrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-health-event-snow-integration'
      Runtime: python3.9
      Handler: HealthEventSnowIntegration.lambda_handler 
      Code:
        S3Bucket: !Ref S3BucketName
        S3Key: !Ref HealthEventSnowIntegrationLambdaKey
      Environment:
        Variables:
          LOG_LEVEL: INFO
          DYNAMODB_TRACK_TABLE: !Ref TrackEventTable
          SNOW_SECRET_NAME: !Ref ServiceNowSecret
          SNOW_URL: !Ref ServiceNowUrl
          DEPLOY_MODEL: !Ref DeployModel
          ASSUME_ROLE_NAME: !If 
            - IsTagModel
            - !Ref AssumeRoleName
            - !Ref "AWS::NoValue"
          TAG_KEY: !If 
            - IsTagModel
            - !Ref TagKey
            - !Ref "AWS::NoValue"
      MemorySize: 256
      Timeout: 240
      Role: !GetAtt ServiceNowIntegrationRole.Arn

  # Event Source Mapping for ServiceNow Integration Lambda
  ServiceNowIntegrationEventMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      Enabled: true
      EventSourceArn: !GetAtt HealthEventQueue.Arn
      FunctionName: !Ref ServiceNowIntegrationFunction
      MaximumBatchingWindowInSeconds: 60  # 1 minute

  # IAM Roles
  HealthEventProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt HealthEventIngestionQueue.Arn
        - PolicyName: HealthEventProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AWSHealthAccess
                Effect: Allow
                Action:
                  - health:DescribeEvents
                  - health:DescribeEventDetails
                  - health:DescribeAffectedEntities
                Resource: !Sub "arn:aws:health:${AWS::Region}::*"
              - !If
                - IsTagModel
                - Sid: CrossAccountAssumeRole
                  Effect: Allow
                  Action:
                    - sts:AssumeRole
                  Resource: !Sub 'arn:aws:iam::*:role/${AssumeRoleName}'
                - !Ref AWS::NoValue
              - Sid: TagAccess
                Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                Resource: '*'
              - Sid: SQSAccess
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt HealthEventQueue.Arn
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt TrackEventTable.Arn
                  - !Sub '${TrackEventTable.Arn}/index/*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-processor-role'

  ServiceNowIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ServiceNowIntegrationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SQSAccess
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt HealthEventQueue.Arn
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: 
                  - !Ref ServiceNowSecret
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ServiceNowSecret}*'
              - Sid: DynamoDBAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt TrackEventTable.Arn
                  - !Sub '${TrackEventTable.Arn}/index/*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-servicenow-role'

  # Custom Event Bus
  HealthEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub '${AWS::StackName}-custom-health-event-bus'

  # EventBridge Rule
  HealthEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-health-event-rule'
      Description: 'Capture AWS Health scheduled change events'
      EventBusName: !Ref HealthEventBus
      EventPattern:
        source:
          - aws.health
        detail-type:
          - AWS Health Event
        detail:
          eventTypeCategory:
            - scheduledChange
          eventTypeCode:
            - { "suffix": { "equals-ignore-case": "_PLANNED_LIFECYCLE_EVENT" }}
      State: ENABLED
      Targets:
        - Arn: !GetAtt HealthEventIngestionQueue.Arn
          Id: HealthEventIngestionQueue

  # Lambda Permission for EventBridge
  EventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref HealthEventProcessorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HealthEventRule.Arn

Outputs:
  DeployModel:
    Description: Selected deployment model for ServiceNow Integration
    Value: !Ref DeployModel

  DynamoDBTable:
    Description: Name of the DynamoDB table (deprecated - use DynamoDBTrackTable)
    Value: !Ref TrackEventTable

  DynamoDBTrackTable:
    Description: Name of the DynamoDB table used for event tracking
    Value: !Ref TrackEventTable

  EventBridgeRuleName:
    Description: Name of the EventBridge rule
    Value: !Ref HealthEventRule

  ServiceNowSecretName:
    Description: Name of the ServiceNow Secret in Secrets Manager
    Value: !Ref ServiceNowSecret

  HealthEventQueueURL:
    Description: URL of the SQS queue for health events
    Value: !Ref HealthEventQueue

  HealthEventIngestionQueueURL:
    Description: URL of the SQS queue for health event ingestion
    Value: !Ref HealthEventIngestionQueue

  HealthEventQueueARN:
    Description: ARN of the SQS queue for health events
    Value: !GetAtt HealthEventQueue.Arn

  HealthEventDLQURL:
    Description: URL of the Dead Letter Queue
    Value: !Ref HealthEventDLQ

  HealthEventProcessorFunctionArn:
    Description: ARN of the Health Event Processor Lambda function
    Value: !GetAtt HealthEventProcessorFunction.Arn

  ServiceNowIntegrationFunctionArn:
    Description: ARN of the ServiceNow Integration Lambda function
    Value: !GetAtt ServiceNowIntegrationFunction.Arn

  CustomEventBusArn:
    Description: ARN of the custom EventBridge event bus
    Value: !GetAtt HealthEventBus.Arn
